version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: patent_pgvector
    restart: always
    environment:
      POSTGRES_DB: patent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

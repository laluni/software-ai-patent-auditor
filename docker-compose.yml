version: '3.8'

services:
  # 1. PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: patent_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: patent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ollama Local LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: patent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  # 3. Streamlit Application
  web:
    build: .
    container_name: patent_auditor_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=patent_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama_models:
